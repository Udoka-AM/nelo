[package]
name = "nelo_vault"
version = "0.1.0"
description = "Nelo vault — locked collateral, 128-slot replay window, timelocked withdraw, Trust Stake"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "nelo_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
solana-instructions-sysvar = "3.0.0"
solana-sdk-ids = "3.1.0"

[dev-dependencies]
litesvm = { version = "0.16.0", features = ["precompiles"] }
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
p256 = { version = "0.13", features = ["ecdsa"] }
solana-pubkey = "3"
serde_json = "1"
solana-client = "4"
solana-commitment-config = "3"
solana-system-interface = "2"
shellexpand = "3"
solana-instruction = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
