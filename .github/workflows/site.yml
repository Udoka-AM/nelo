# The landing page, built from site/ and published to GitHub Pages.
#
# One-time setup, in the repository's settings:
#   Pages → Build and deployment → Source: GitHub Actions
#   Secrets and variables → Actions → Variables:
#     SUPABASE_PUBLISHABLE_KEY  the nelo project's publishable key (sb_publishable_…).
#                               Public by design, but kept out of the repository.
#                               Until it is set, the waitlist says it opens soon.
#     SUPABASE_URL              optional; defaults to the nelo project
#     SITE_URL                  optional; defaults to https://udoka-am.github.io/nelo/
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment halfway; let the newer one queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @nelo/site
      - run: pnpm --filter @nelo/site build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://udoka-am.github.io/nelo/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
